spring.application.name=sportsnet
#database
spring.datasource.url=jdbc:mysql://localhost:3306/sportsnet_db
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#secret key
jwt.secret=SportsNetAppSecretKeyForJwtSigning2026DoNotShareThisWithAnyone


#to upload images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/profile-images