<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Black Body Gradient -->
    <radialGradient id="matteBlack" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="60%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="championshipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6A8"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#F5E6A8"/>
    </linearGradient>

    <!-- Subtle Gold Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Base (Matte Black & Gold Trim) -->
    <path d="M 180 430 L 332 430 L 320 455 L 192 455 Z" fill="url(#matteBlack)"/>
    <rect x="170" y="455" width="172" height="15" rx="3" fill="url(#championshipGold)"/>

    <!-- Gold Stem / Pedestal Ring -->
    <path d="M 216 380 Q 256 395 296 380 L 290 430 L 222 430 Z" fill="url(#championshipGold)"/>
    
    <!-- Trophy Main Body (Matte Black) -->
    <path d="M 176 180 C 176 310 216 380 256 380 C 296 380 336 310 336 180 Z" fill="url(#matteBlack)"/>

    <!-- Left Handle -->
    <path d="M 178 190 C 100 190 100 320 210 340 C 205 325 195 305 178 290 C 130 270 130 210 178 205 Z" fill="url(#championshipGold)"/>

    <!-- Right Handle -->
    <path d="M 334 190 C 412 190 412 320 302 340 C 307 325 317 305 334 290 C 382 270 382 210 334 205 Z" fill="url(#championshipGold)"/>

    <!-- Body Gold Accents & Rim Outlines -->
    <path d="M 176 180 C 176 310 216 380 256 380 C 296 380 336 310 336 180" fill="none" stroke="url(#championshipGold)" stroke-width="8"/>
    
    <!-- Crown / Top Rim (Gold Accent) -->
    <path d="M 166 180 L 206 100 L 256 150 L 306 100 L 346 180 Z" fill="url(#championshipGold)"/>
    <path d="M 176 175 L 206 115 L 256 158 L 306 115 L 336 175 Z" fill="url(#matteBlack)"/>
    <ellipse cx="256" cy="180" rx="80" ry="12" fill="url(#championshipGold)"/>

    <!-- Specular Highlight Layer -->
    <path d="M 246 185 C 230 240 230 320 242 375 C 248 375 252 370 248 350 C 240 300 240 230 252 185 Z" fill="url(#goldHighlight)" opacity="0.3"/>
  </g>
</svg>
